<div class="bg-gray-700 max-h-full min-h-screen p-4">
        <!-- CONTEÚDO DA PÁGINA APENAS QUANDO O EVENTO EXISTIR -->
    <div *ngIf="evento" class="flex w-full gap-6">

        <!-- LADO ESQUERDO -->
        <div class="w-1/2 flex flex-col items-center gap-6">

            <!-- DETALHES DO EVENTO -->
            <div class="bg-gray-900 rounded-2xl overflow-hidden shadow-lg w-full">

                <div class="bg-blue-500 p-2">
                    <h1 class="text-4xl text-white font-bold text-center">{{evento.nome}}</h1>
                </div>

                <div class="p-10 text-white">
                    <p class="text-xl">Local: {{evento.local}}</p>
                    <p class="text-xl">Capacidade: {{evento.capacidade_maxima}}</p>
                    <p class="text-xl">Status: {{evento.status}}</p>
                </div>

                <button 
                    routerLink="/eventos"
                    class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-6 mb-3 ml-3 rounded-xl">
                    Voltar
                </button>

            </div>

            <!-- FORMULÁRIO PARTICIPANTE -->
            <div class="w-full">
                <app-participantes [eventoId]="evento.id" (participatenCadastradoOutput)="atualizarParticipantes()"></app-participantes>
            </div>

        </div>

        <!-- LADO DIREITO -->
        <div class="w-1/2">
            <div class="bg-gray-900 rounded-2xl shadow-lg p-6">
                <app-lista-participantes [eventoId]="evento.id"></app-lista-participantes>
            </div>
        </div>
    </div>

    <!-- CASO O EVENTO AINDA NÃO TENHA CARREGADO -->
    <div *ngIf="!evento" class="text-white text-center text-2xl">
        Carregando evento...
    </div>
    
</div>
