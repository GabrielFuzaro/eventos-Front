<form [formGroup]="participanteForm" (ngSubmit)="onSubmit()" class="bg-gray-900 rounded-2xl shadow-lg p-8 flex flex-col gap-5 w-full">

    <h2 class="text-2xl font-bold text-white text-center">
        Cadastrar Participante
    </h2>

    <p class="text-gray-400 text-center text-sm">
        Preencha seus dados para participar do evento
    </p>

    <div class="flex flex-col gap-1">
        <label 
            for="nome" 
            class="text-sm font-semibold text-gray-200">
            Nome
        </label>
        <input 
            type="text" 
            id="nome" 
            formControlName="nome"
            placeholder="Digite seu nome"
            class="w-full rounded-xl bg-gray-800 border border-gray-600 
                px-4 py-3 text-white placeholder-gray-500
                outline-none transition duration-200
                focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30
                hover:border-gray-500"
        >
    </div>
    <div class="flex flex-col gap-1">
        <label 
            for="email" 
            class="text-sm font-semibold text-gray-200">
            Email
        </label>
        <input 
            type="email" 
            id="email" 
            formControlName="email"
            placeholder="Digite seu email"
            class="w-full rounded-xl bg-gray-800 border border-gray-600 
                px-4 py-3 text-white placeholder-gray-500
                outline-none transition duration-200
                focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30
                hover:border-gray-500"
        >
    </div>

    <button 
        type="submit"
        [disabled]="participanteForm.invalid"
        class="w-full mt-2
            bg-blue-500 hover:bg-blue-600
            disabled:bg-gray-600
            disabled:cursor-not-allowed
            disabled:opacity-50
            transition duration-200
            text-white font-bold
            py-3 rounded-xl
            shadow-md
            hover:shadow-blue-500/20">

        Cadastrar

    </button>

    <div 
        *ngIf="mensagemErro"
        class="bg-red-500/10 border border-red-500/40
            text-red-300 p-3 rounded-xl text-center
            text-sm font-medium">

        {{mensagemErro}}

    </div>


    <div 
        *ngIf="mensagemSucesso"
        class="bg-green-500/10 border border-green-500/40
            text-green-300 p-3 rounded-xl text-center
            text-sm font-medium">

        {{mensagemSucesso}}

    </div>

</form>
