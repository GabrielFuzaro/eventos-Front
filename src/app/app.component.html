<div class="flex min-h-screen flex-col">

    <a href="#conteudo" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[70] focus:rounded-full focus:bg-white focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-codiub-brand focus:shadow-lg">
        Pular para o conteúdo
    </a>

    <!-- Navbar -->
    <header class="sticky top-0 z-30 flex items-center justify-between gap-3 bg-codiub-navy px-4 py-3">
        <div class="flex min-w-0 items-center gap-2">
            <button
                *ngIf="areaInterna"
                type="button"
                (click)="alternarMenu()"
                [attr.aria-expanded]="menuAberto"
                aria-controls="menu-lateral"
                aria-label="Abrir menu"
                class="inline-flex h-10 w-10 items-center justify-center rounded-lg text-white hover:bg-white/10 focus:outline-none focus-visible:ring-2 focus-visible:ring-white md:hidden">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>

            <a routerLink="/eventos" class="flex items-center gap-3 rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-white">
                <img src="assets/logo/codiub-branca-horizontal.png" alt="Codiub" class="h-8 w-auto">
                <span class="hidden h-6 w-px bg-white/30 sm:block" aria-hidden="true"></span>
                <span class="hidden text-base font-semibold text-white sm:inline">Eventos</span>
            </a>
        </div>

        <div *ngIf="areaInterna && authService.estaLogado()" class="flex items-center gap-2 sm:gap-3">
            <span class="hidden text-sm text-white sm:inline">
                Olá, <span class="font-semibold">{{ primeiroNome }}</span>
            </span>
            <span class="badge hidden bg-white/10 text-codiub-cyan sm:inline-flex">
                {{ authService.isAdmin() ? 'Administrador' : 'Usuário' }}
            </span>
            <button
                type="button"
                (click)="logout()"
                aria-label="Sair"
                title="Sair"
                class="inline-flex h-10 w-10 items-center justify-center rounded-full text-white hover:bg-white/10 focus:outline-none focus-visible:ring-2 focus-visible:ring-white">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
                </svg>
            </button>
        </div>
    </header>

    <div class="flex flex-1">

        <!-- Overlay do drawer (celular) -->
        <div
            *ngIf="areaInterna && menuAberto"
            (click)="fecharMenu()"
            class="fixed inset-0 z-40 bg-black/50 md:hidden"
            aria-hidden="true">
        </div>

        <!-- Sidebar: drawer no celular, só ícones entre md e lg, aberta a partir de lg -->
        <nav
            *ngIf="areaInterna"
            id="menu-lateral"
            aria-label="Menu principal"
            class="fixed inset-y-0 left-0 z-50 w-[280px] bg-codiub-sidebar px-3.5 py-4 shadow-lg transition-transform duration-300
                md:static md:z-auto md:w-sidebar md:translate-x-0 md:border-r md:border-gray-200 md:py-5 md:shadow-none lg:w-sidebar-open"
            [class.translate-x-0]="menuAberto"
            [class.-translate-x-full]="!menuAberto">

            <div class="mb-4 flex items-center justify-between md:hidden">
                <img src="assets/logo/codiub-azul-horizontal.png" alt="Codiub" class="h-7 w-auto">
                <button type="button" (click)="fecharMenu()" aria-label="Fechar menu" class="btn-icon">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <p class="mb-2 hidden px-3 text-section-label uppercase text-codiub-navy lg:block">Menu</p>

            <a
                routerLink="/eventos"
                routerLinkActive="bg-navy-tint font-bold text-codiub-brand shadow-[inset_3px_0_0_#002069]"
                ariaCurrentWhenActive="page"
                title="Eventos"
                aria-label="Eventos"
                class="mb-1.5 flex min-h-[44px] items-center gap-3 rounded-lg px-3 text-sm text-gray-800 transition-colors hover:bg-navy-hover-tint
                    focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 md:justify-center lg:justify-start">
                <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="16" rx="2" />
                    <path d="M16 3v4M8 3v4M3 10h18" />
                </svg>
                <span class="md:hidden lg:inline">Eventos</span>
            </a>
        </nav>

        <main id="conteudo" class="min-w-0 flex-1" [ngClass]="areaInterna ? 'p-5' : 'flex items-center justify-center p-4'">
            <router-outlet></router-outlet>
        </main>
    </div>

    <!-- Footer -->
    <footer class="grid items-center gap-2 bg-codiub-navy px-4 py-3 text-center text-sm text-gray-300 md:grid-cols-3 md:text-left">
        <a href="https://codiub.com.br" target="_blank" rel="noopener" class="justify-self-center rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-white md:justify-self-start">
            <img src="assets/logo/codiub-branca-horizontal.png" alt="Codiub" class="h-7 w-auto">
        </a>
        <p class="md:text-center">Sistema de eventos</p>
        <p class="md:text-right">© {{ ano }} Codiub - Todos os direitos reservados.</p>
    </footer>
</div>
