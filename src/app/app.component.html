<header
    *ngIf="mostrarNavbar"
    class="sticky top-0 z-40 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-xl">

    <nav class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-4 sm:px-6">

        <a routerLink="/eventos" class="group flex items-center gap-2.5">
            <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-fuchsia-500 shadow-lg shadow-indigo-500/30">
                <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
            </span>
            <span class="text-lg font-bold tracking-tight text-white">Eventos</span>
        </a>

        <div class="flex items-center gap-2 sm:gap-3">

            <div class="hidden items-center gap-2.5 sm:flex">
                <span class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-800 text-xs font-bold text-slate-200 ring-1 ring-slate-700">
                    {{ iniciais }}
                </span>
                <div class="leading-tight">
                    <p class="text-sm font-semibold text-slate-200">{{ authService.getUsername() }}</p>
                    <p class="text-[11px] text-slate-500">{{ authService.isAdmin() ? 'Administrador' : 'Usuário' }}</p>
                </div>
            </div>

            <span class="hidden h-6 w-px bg-slate-800 sm:block"></span>

            <button type="button" (click)="logout()" class="btn-ghost px-3 py-2">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
                </svg>
                Sair
            </button>
        </div>

    </nav>
</header>

<router-outlet></router-outlet>
