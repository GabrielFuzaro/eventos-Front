<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Gestão de Eventos | Prefeitura de Uberaba</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#042D62">
  <meta name="description" content="Sistema de gestão de eventos, inscrições e lista de espera da Prefeitura Municipal de Uberaba.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>

  <!-- VLibras — Acessibilidade em Libras (padrão governamental / Prefeitura) -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script
    src="https://vlibras.gov.br/app/vlibras-plugin.js"
    defer
    onload="if (window.VLibras) { new window.VLibras.Widget('https://vlibras.gov.br/app'); }">
  </script>
</body>
</html>
