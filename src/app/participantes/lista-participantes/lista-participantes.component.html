<section class="card overflow-hidden" aria-labelledby="tituloParticipantes">

    <div class="flex items-center gap-2 bg-codiub-navy px-5 py-3.5">
        <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" />
        </svg>
        <h2 id="tituloParticipantes" class="flex-1 text-base font-bold text-white">Participantes</h2>
        <span class="text-sm font-semibold text-codiub-cyan tabular-nums">{{ totalParticipantes }}</span>
    </div>

    <div class="relative overflow-x-auto">
        <table class="min-w-full text-sm">
            <caption class="sr-only">Participantes do evento</caption>
            <thead class="cabecalho-tabela">
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Email</th>
                    <th *ngIf="authService.isAdmin()" scope="col" class="text-right"><span class="sr-only">Ações</span></th>
                </tr>
            </thead>
            <tbody class="block md:table-row-group">
                <tr *ngFor="let participante of participantes" class="linha-tabela">
                    <td class="celula-tabela font-semibold text-codiub-ink">
                        <span class="cell-label font-medium">Nome: </span>{{ participante.nome }}
                    </td>
                    <td class="celula-tabela break-all text-gray-600">
                        <span class="cell-label">Email: </span>{{ participante.email }}
                    </td>
                    <td *ngIf="authService.isAdmin()" class="celula-tabela pt-2 md:pt-3 md:text-right">
                        <button
                            type="button"
                            (click)="excluirParticipante(participante)"
                            [attr.aria-label]="'Excluir participante ' + participante.nome"
                            title="Excluir"
                            class="btn-icon-danger">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6M10 11v6M14 11v6" />
                            </svg>
                        </button>
                    </td>
                </tr>

                <tr *ngIf="participantes.length === 0" class="block md:table-row">
                    <td [attr.colspan]="authService.isAdmin() ? 3 : 2" class="block py-10 text-center text-sm text-gray-500 md:table-cell">
                        Nenhum participante inscrito ainda.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <nav *ngIf="totalPaginas > 1" class="flex items-center justify-between gap-3 border-t border-gray-100 p-3 text-sm text-gray-600" aria-label="Paginação de participantes">
        <p>Página {{ paginaAtual + 1 }} de {{ totalPaginas }}</p>
        <div class="flex items-center gap-1">
            <button type="button" (click)="irParaPagina(paginaAtual - 1)" [disabled]="paginaAtual === 0" aria-label="Página anterior" class="btn-icon">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 19l-7-7 7-7" /></svg>
            </button>
            <button type="button" (click)="irParaPagina(paginaAtual + 1)" [disabled]="paginaAtual >= totalPaginas - 1" aria-label="Próxima página" class="btn-icon">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
            </button>
        </div>
    </nav>

    <div *ngIf="mensagemErro || mensagemSucesso" class="border-t border-gray-100 p-3">
        <app-aviso *ngIf="mensagemErro" tipo="erro" [mensagem]="mensagemErro"></app-aviso>
        <app-aviso *ngIf="mensagemSucesso" tipo="sucesso" [mensagem]="mensagemSucesso"></app-aviso>
    </div>
</section>
