<div class="min-h-screen bg-slate-950 flex items-center justify-center p-6">


    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8">

        <h2 class="text-2xl font-bold text-white mb-1 text-center">
            Login
        </h2>

        <p class="text-slate-400 text-sm text-center mb-6">
            Entre na sua conta para continuar
        </p>

        <form (ngSubmit)="login()">

            <div class="mb-5">
                <label
                    for="username"
                    class="block text-sm font-semibold text-slate-300 mb-2">
                    Usuário
                </label>

                <input
                    type="text"
                    id="username"
                    [(ngModel)]="username"
                    name="username"
                    required
                    placeholder="Digite seu usuário"
                    class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
            </div>

            <div class="mb-6">
                <label
                    for="password"
                    class="block text-sm font-semibold text-slate-300 mb-2">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    [(ngModel)]="password"
                    name="password"
                    required
                    placeholder="Digite sua senha"
                    class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
            </div>

            <button
                type="submit"
                class="w-full bg-indigo-500 hover:bg-indigo-400 transition text-white font-semibold py-3 rounded-xl">
                Entrar
            </button>

        </form>

    </div>


</div>
