<div class="dialog-overlay" (click)="fecharOutput.emit()">
    <div
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-rota-titulo"
        (click)="$event.stopPropagation()"
        class="card w-full max-w-sm rounded-panel p-6 shadow-lg">

        <p class="text-center text-eyebrow uppercase text-gray-500">Traçar rota</p>
        <h3 id="modal-rota-titulo" class="mt-1 break-words text-center text-xl font-bold text-codiub-brand">
            {{ nome }}
        </h3>
        <p class="mt-1 flex items-center justify-center gap-1.5 text-center text-sm text-gray-600">
            <svg class="h-4 w-4 shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 21s-7-6.2-7-11a7 7 0 1114 0c0 4.8-7 11-7 11z" />
                <circle cx="12" cy="10" r="2.5" />
            </svg>
            <span class="break-words">{{ local }}</span>
        </p>

        <div *ngIf="dataEvento" class="mt-4 flex items-center justify-between rounded-lg border border-gray-100 bg-gray-50 px-3 py-2 text-sm">
            <span class="font-medium text-gray-600">Data e horário</span>
            <span class="font-bold tabular-nums text-codiub-ink">
                {{ dataEvento | date:'dd/MM/yyyy' }} às {{ dataEvento | date:'HH:mm' }}
            </span>
        </div>

        <div class="mt-6 flex items-center justify-center gap-6">
            <a
                [href]="urlGoogleMaps"
                target="_blank"
                rel="noopener noreferrer"
                class="group flex flex-col items-center gap-2 rounded-lg p-1 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600">
                <img
                    src="assets/icons/google-maps.png"
                    alt="Google Maps"
                    class="h-14 w-14 rounded-lg shadow-sm transition-transform group-hover:scale-105">
                <span class="inline-flex h-9 items-center justify-center rounded-full bg-blue-600 px-4 text-xs font-bold text-white transition-colors group-hover:bg-blue-700">
                    Google Maps
                </span>
            </a>

            <a
                [href]="urlWaze"
                target="_blank"
                rel="noopener noreferrer"
                class="group flex flex-col items-center gap-2 rounded-lg p-1 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600">
                <img
                    src="assets/icons/waze.png"
                    alt="Waze"
                    class="h-14 w-14 rounded-lg shadow-sm transition-transform group-hover:scale-105">
                <span class="inline-flex h-9 items-center justify-center rounded-full bg-blue-600 px-4 text-xs font-bold text-white transition-colors group-hover:bg-blue-700">
                    Waze
                </span>
            </a>
        </div>

        <div class="mt-6 border-t border-gray-100 pt-4">
            <button #botaoFechar type="button" (click)="fecharOutput.emit()" class="btn-secondary w-full">
                Fechar
            </button>
        </div>
    </div>
</div>
