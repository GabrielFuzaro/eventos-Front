<div
    [attr.role]="tipo === 'erro' ? 'alert' : 'status'"
    class="flex items-start gap-2.5 rounded-lg border px-4 py-3 text-sm font-medium"
    [ngClass]="classes">

    <svg *ngIf="tipo === 'sucesso'" class="mt-px h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M8.5 12.5l2.5 2.5 4.5-5" />
    </svg>
    <svg *ngIf="tipo === 'erro'" class="mt-px h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 8v5M12 16h.01" />
    </svg>
    <svg *ngIf="tipo === 'info'" class="mt-px h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 11v5M12 8h.01" />
    </svg>

    <span class="min-w-0 flex-1">{{ mensagem }}<ng-content></ng-content></span>
</div>
