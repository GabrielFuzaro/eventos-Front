<form [formGroup]="eventoFormulario" (ngSubmit)="onSubmit()" class="bg-gray-900 rounded-2xl shadow-lg p-8 flex flex-col gap-5 w-full">
    <div class="w-full max-w-lg mx-auto bg-white rounded-2xl shadow-lg p-8">

        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
            Dados do Evento
        </h2>

        <div class="mb-5">
            <label for="nome" class="block text-sm font-semibold text-gray-700 mb-2">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                formControlName="nome"
                placeholder="Digite o nome do evento"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-blue-500
                    focus:border-blue-500 transition"
            >
        </div>

        <div class="mb-5">
            <label for="local" class="block text-sm font-semibold text-gray-700 mb-2">
                Local
            </label>

            <input
                type="text"
                id="local"
                formControlName="local"
                placeholder="Digite o local do evento"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-blue-500
                    focus:border-blue-500 transition"
            >
        </div>

        <div class="mb-5">
            <label for="capacidade_maxima" class="block text-sm font-semibold text-gray-700 mb-2">
                Capacidade Máxima
            </label>

            <input
                type="number"
                id="capacidade_maxima"
                formControlName="capacidade_maxima"
                placeholder="Ex: 100"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-blue-500
                    focus:border-blue-500 transition"
            >
        </div>

        <div class="mb-5">
            <label for="data_evento" class="block text-sm font-semibold text-gray-700 mb-2">
                Data e Hora do Evento
            </label>

            <input
                type="datetime-local"
                id="data_evento"
                formControlName="data_evento"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-blue-500
                    focus:border-blue-500 transition"
            >
        </div>
        <button 
        type="submit"
        [disabled]="eventoFormulario.invalid"
        class="w-full mt-2
            bg-blue-500 hover:bg-blue-600
            disabled:bg-gray-600
            disabled:cursor-not-allowed
            disabled:opacity-50
            transition duration-200
            text-white font-bold
            py-3 rounded-xl
            shadow-md
            hover:shadow-blue-500/20">

        Cadastrar

    </button>

    <div 
        *ngIf="mensagemErro"
        class="bg-red-500 border border-red-500
            text-red-300 p-3 rounded-xl text-center
            text-sm font-medium mt-4">

        {{mensagemErro}}

    </div>


    <div 
        *ngIf="mensagemSucesso"
        class="bg-green-500 border border-green-500
            text-green-200 p-3 rounded-xl text-center
            text-sm font-medium mt-4">

        {{mensagemSucesso}}

    </div>

    </div>
</form>
