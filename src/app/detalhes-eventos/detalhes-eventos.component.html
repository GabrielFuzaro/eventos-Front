<div *ngIf="evento" class="w-full min-h-screen bg-gray-700 flex justify-center items-center">

    <div class="bg-gray-900 rounded-2xl overflow-hidden shadow-lg w-1/2">

        <div class="bg-blue-500 p-6">
            <h1 class="text-4xl text-white font-bold text-center">
                {{evento.nome}}
            </h1>
        </div>

        <div class="p-10 text-white">

            <p class="text-xl">Local: {{evento.local}}</p>
            <p class="text-xl">Capacidade: {{evento.capacidade_maxima}}</p>
            <p class="text-xl">Status: {{evento.status}}</p>

        </div>

        <button 
            routerLink="/eventos"
            class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-6 mb-3 ml-3  rounded-xl mt-6">
            Voltar
        </button>
        
    </div>

</div>
