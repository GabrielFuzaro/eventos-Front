<form [formGroup]="eventoFormulario" (ngSubmit)="onSubmit()" class="card overflow-hidden">

    <div class="flex items-start justify-between gap-4 border-b border-slate-800 px-6 py-5">
        <div>
            <h2 class="text-lg font-bold text-white">Novo evento</h2>
            <p class="mt-0.5 text-sm text-slate-400">Preencha os dados para cadastrar.</p>
        </div>
        <button type="button" (click)="fecharOutput.emit()" aria-label="Fechar" class="btn-icon -mr-2 -mt-1">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <div class="space-y-5 px-6 py-6">

        <div>
            <label for="nome" class="label">Nome</label>
            <input
                id="nome"
                type="text"
                formControlName="nome"
                placeholder="Ex: Workshop de Angular"
                class="input"
                [class.input-invalid]="invalido('nome')">
            <span *ngIf="invalido('nome')" class="field-error">Nome é obrigatório.</span>
        </div>

        <div class="grid gap-5 sm:grid-cols-2">
            <div>
                <label for="categoriaId" class="label">Categoria</label>
                <select
                    id="categoriaId"
                    formControlName="categoriaId"
                    class="input"
                    [class.input-invalid]="invalido('categoriaId')">
                    <option [ngValue]="null" disabled>Selecione...</option>
                    <option *ngFor="let categoria of categorias" [ngValue]="categoria.id">{{ categoria.nome }}</option>
                </select>
                <span *ngIf="invalido('categoriaId')" class="field-error">Categoria é obrigatória.</span>
            </div>

            <div>
                <label for="capacidade_maxima" class="label">Capacidade</label>
                <input
                    id="capacidade_maxima"
                    type="number"
                    min="1"
                    formControlName="capacidade_maxima"
                    placeholder="Ex: 100"
                    class="input"
                    [class.input-invalid]="invalido('capacidade_maxima')">
                <span *ngIf="eventoFormulario.get('capacidade_maxima')?.hasError('required') && eventoFormulario.get('capacidade_maxima')?.touched" class="field-error">
                    Capacidade é obrigatória.
                </span>
                <span *ngIf="eventoFormulario.get('capacidade_maxima')?.hasError('min') && eventoFormulario.get('capacidade_maxima')?.touched" class="field-error">
                    Deve ser maior que 0.
                </span>
            </div>
        </div>

        <div>
            <label for="local" class="label">Local</label>
            <input
                id="local"
                type="text"
                formControlName="local"
                placeholder="Ex: Auditório principal"
                class="input"
                [class.input-invalid]="invalido('local')">
            <span *ngIf="invalido('local')" class="field-error">Local é obrigatório.</span>
        </div>

        <div>
            <label for="data_evento" class="label">Data e hora</label>
            <input
                id="data_evento"
                type="datetime-local"
                formControlName="data_evento"
                class="input"
                [class.input-invalid]="invalido('data_evento')">
            <span *ngIf="invalido('data_evento')" class="field-error">Data é obrigatória.</span>
        </div>

        <div *ngIf="mensagemErro" role="alert" class="alert-error">{{ mensagemErro }}</div>
    </div>

    <div class="flex justify-end gap-2 border-t border-slate-800 bg-slate-950/30 px-6 py-4">
        <button type="button" (click)="fecharOutput.emit()" class="btn-secondary">Cancelar</button>
        <button type="submit" [disabled]="eventoFormulario.invalid || enviando" class="btn-primary">
            {{ enviando ? 'Salvando...' : 'Cadastrar evento' }}
        </button>
    </div>

</form>
