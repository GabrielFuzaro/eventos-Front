<div class="grid w-full overflow-hidden rounded-lg border border-gray-200 bg-white shadow-lg sm:max-w-3xl md:grid-cols-2">

    <!-- Sobre o produto -->
    <aside class="hidden bg-codiub-navy p-8 text-white md:block">
        <img src="assets/logo/codiub-branca-horizontal.png" alt="Codiub" class="h-8 w-auto">
        <h2 class="mt-8 text-xl font-bold">Sistema de eventos</h2>
        <ul class="mt-4 text-sm leading-8 text-gray-300">
            <li class="flex items-center gap-2">
                <svg class="h-4 w-4 shrink-0 text-codiub-cyan" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7" /></svg>
                Controle de vagas e status em tempo real
            </li>
            <li class="flex items-center gap-2">
                <svg class="h-4 w-4 shrink-0 text-codiub-cyan" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7" /></svg>
                Lista de espera automática
            </li>
            <li class="flex items-center gap-2">
                <svg class="h-4 w-4 shrink-0 text-codiub-cyan" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7" /></svg>
                Participantes exportáveis em Excel
            </li>
        </ul>
    </aside>

    <!-- Formulário -->
    <div class="p-6 sm:p-8">
        <img src="assets/logo/codiub-azul-horizontal.png" alt="Codiub" class="h-8 w-auto md:hidden">
        <h1 class="mt-6 font-bold text-codiub-brand md:mt-0 md:text-xl">Entrar no sistema</h1>
        <p class="mt-1 text-sm text-gray-600">Use seu usuário e senha para continuar.</p>

        <form (ngSubmit)="login()" class="mt-6 space-y-4 md:space-y-6">
            <div>
                <label for="username" class="label">Usuário</label>
                <input type="text" id="username" name="username" [(ngModel)]="username" required autocomplete="username"
                    placeholder="Ex: maria.souza" class="input">
            </div>

            <div>
                <label for="password" class="label">Senha</label>
                <div class="relative">
                    <input [type]="mostrarSenha ? 'text' : 'password'" id="password" name="password" [(ngModel)]="password" required
                        autocomplete="current-password" class="input pr-10">
                    <button type="button" (click)="mostrarSenha = !mostrarSenha"
                        [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'" [attr.aria-pressed]="mostrarSenha"
                        class="absolute inset-y-0 right-0 flex w-10 items-center justify-center rounded-r-lg text-gray-500 hover:text-blue-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600">
                        <svg *ngIf="!mostrarSenha" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" />
                        </svg>
                        <svg *ngIf="mostrarSenha" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0112 19c-6.5 0-10-7-10-7a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c6.5 0 10 7 10 7a18.5 18.5 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24M1 1l22 22" />
                        </svg>
                    </button>
                </div>
            </div>

            <app-aviso *ngIf="mensagemErro" class="block" tipo="erro" [mensagem]="mensagemErro"></app-aviso>
            <app-aviso *ngIf="mensagemSucesso" class="block" tipo="sucesso" [mensagem]="mensagemSucesso"></app-aviso>

            <button type="submit" [disabled]="enviando || !username || !password" class="btn-primary w-full">
                {{ enviando ? 'Entrando...' : 'Entrar' }}
            </button>

            <p class="text-center text-sm text-gray-600">
                Ainda não tem conta?
                <a routerLink="/auth/cadastro" class="link">Criar conta</a>
            </p>
        </form>
    </div>
</div>
