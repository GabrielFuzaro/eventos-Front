<div class="bg-slate-950 min-h-screen p-6">

    <div *ngIf="evento" class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6">

        <div class="flex flex-col gap-6">

            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">

                <div class="px-6 py-5 border-b border-slate-800">
                    <div class="flex items-start justify-between gap-3">
                        <h1 class="text-2xl font-bold text-white leading-snug">{{evento.nome}}</h1>

                        <div class="flex items-center gap-2 shrink-0">
                            <button
                                type="button"
                                (click)="baixar()"
                                class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3.5 py-2 rounded-xl whitespace-nowrap transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-400/50">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                                </svg>
                                Excel
                            </button>

                            <span
                                class="text-[11px] font-semibold px-2 py-1 rounded-full whitespace-nowrap"
                                [ngClass]="{
                                    'bg-rose-500/15 text-rose-400': evento.status === 'LOTADO',
                                    'bg-amber-500/15 text-amber-400': evento.status === 'ENCERRADO',
                                    'bg-emerald-500/15 text-emerald-400': evento.status !== 'LOTADO' && evento.status !== 'ENCERRADO'
                                }">
                                {{evento.status === 'LOTADO' ? 'Lotado' : evento.status === 'ABERTO' ? 'aberto' : 'Encerrado'}}
                            </span>
                        </div>
                    </div>
                </div>

                <div class="px-6 py-5 space-y-2.5 text-sm">
                    <div class="flex justify-between">
                        <span class="text-slate-500">Local</span>
                        <span class="text-slate-200 font-medium">{{evento.local}}</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-slate-500">Capacidade</span>
                        <span class="text-slate-200 font-medium">{{evento.capacidade_maxima}}</span>
                    </div>
                    
                    <div class="flex justify-between">
                        <span class="text-slate-500">Status</span>
                        <span
                            class="font-medium"
                            [ngClass]="{
                                'text-rose-400': evento.status === 'LOTADO',
                                'text-amber-400': evento.status === 'ENCERRADO',
                                'text-emerald-400': evento.status !== 'LOTADO' && evento.status !== 'ENCERRADO'
                            }">
                            {{evento.status}}
                        </span>
                    </div>

                </div>

                <div class="px-6 pb-5">
                    <button
                        routerLink="/eventos"
                        class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2.5 px-5 rounded-xl transition-colors">
                        Voltar
                    </button>
                </div>

            </div>

            <app-participantes [eventoId]="evento.id" [statusEvento]="evento.status" (participanteCadastradoOutput)="atualizarParticipantes()"></app-participantes>

        </div>

        <div>
            <app-lista-participantes [eventoId]="evento.id"></app-lista-participantes>
        </div>

    </div>

    <div *ngIf="!evento" class="text-slate-400 text-center text-lg pt-20">
        Carregando evento...
    </div>

</div>
