<div
    aria-label="Notificações do sistema"
    class="pointer-events-none fixed inset-x-0 top-4 z-[60] flex flex-col items-center gap-2.5 px-4 sm:inset-x-auto sm:right-5 sm:top-16 sm:w-[360px] sm:max-w-[calc(100vw-2.5rem)] sm:items-stretch sm:px-0">

    <div
        *ngFor="let item of notificacoes$ | async; trackBy: rastrearPorId"
        [attr.role]="item.tipo === 'erro' ? 'alert' : 'status'"
        [attr.aria-live]="item.tipo === 'erro' ? 'assertive' : 'polite'"
        aria-atomic="true"
        (mouseenter)="notifier.pausar(item.id)"
        (mouseleave)="notifier.retomar(item.id)"
        (focusin)="notifier.pausar(item.id)"
        (focusout)="notifier.retomar(item.id)"
        [ngClass]="classesCard(item.tipo)"
        class="toast-enter pointer-events-auto flex min-h-[48px] w-full max-w-sm items-center gap-3 rounded-lg border border-l-4 px-4 py-3 text-sm font-medium leading-5 shadow-lg sm:max-w-none">

        <!-- Ícone semântico 20x20 (h-5 w-5, stroke 2 — components.md §18) -->
        <span class="shrink-0" [ngClass]="classesIcone(item.tipo)" aria-hidden="true">
            <svg *ngIf="item.tipo === 'sucesso'" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9" />
                <path d="M8.5 12.5l2.5 2.5 4.5-5" />
            </svg>
            <svg *ngIf="item.tipo === 'erro'" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 8v4.5M12 16h.01" />
            </svg>
            <svg *ngIf="item.tipo === 'aviso'" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
                <path d="M12 9v4M12 17h.01" />
            </svg>
            <svg *ngIf="item.tipo === 'info'" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 11v5M12 8h.01" />
            </svg>
        </span>

        <!-- Mensagem curta e clara em Open Sans 14px -->
        <p class="min-w-0 flex-1 break-words">{{ item.mensagem }}</p>

        <!-- Botão acessível para dispensar manualmente -->
        <button
            type="button"
            (click)="notifier.remover(item.id)"
            aria-label="Fechar notificação"
            title="Fechar"
            [ngClass]="classesBotaoFechar(item.tipo)"
            class="inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-lg transition-colors focus:outline-none focus-visible:ring-2">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>
</div>
