<form class="bg-gray-900 rounded-2xl shadow-lg p-8 flex flex-col gap-5 w-full" (ngSubmit)="cadastrarParticipante()" #participanteForm="ngForm">

    <h2 class="text-2xl font-bold text-white text-center">
        Cadastrar Participante
    </h2>

    <div class="flex flex-col gap-2">
        <label class="text-white font-semibold">Nome</label>
        <input 
            class="rounded-xl p-3 bg-gray-800 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
            type="text"
            name="nome"
            [(ngModel)]="participante.nome"
            placeholder="Digite seu nome"
            required>

    </div>
    <div class="flex flex-col gap-2">
        <label class="text-white font-semibold">Email</label>
        <input 
            class="rounded-xl p-3 bg-gray-800 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
            type="text"
            name="email"
            [(ngModel)]="participante.email"
            placeholder="Digite seu email"
            required>

    </div>

    <input 
        type="hidden"
        name="evento_id"
        [(ngModel)]="participante.eventoId.id">

    <button 
        type="submit"
        class="bg-blue-500 hover:bg-blue-600 transition text-white font-bold py-3 rounded-xl shadow-md w-1/5">
        Cadastrar
    </button>
    <div 
        *ngIf="mensagemErro"
        class="bg-red-500 text-white p-3 rounded-xl text-center">

        {{mensagemErro}}

    </div>
    <div 
        *ngIf="mensagemSucesso"
        class="bg-green-500 text-white p-3 rounded-xl">

        {{mensagemSucesso}}

    </div>
</form>
