<div class="flex min-h-screen flex-col bg-white">

    <a href="#conteudo" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[70] focus:rounded-full focus:bg-white focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-codiub-brand focus:shadow-lg">
        Pular para o conteúdo
    </a>

    <!-- ========================================================================= -->
    <!-- FACE 1: LAYOUT CMS / ADMINISTRATIVO (Admin — idêntico ao Print 1)          -->
    <!-- ========================================================================= -->
    <ng-container *ngIf="modoCms; else topoPublico">
        <header class="sticky top-0 z-30 flex items-center justify-between gap-3 bg-codiub-navy px-4 py-3">
            <div class="flex items-center gap-2">
                <button
                    type="button"
                    (click)="alternarMenu()"
                    [attr.aria-expanded]="menuAberto"
                    aria-controls="menu-lateral"
                    aria-label="Abrir menu"
                    class="inline-flex h-10 w-10 items-center justify-center rounded-lg text-white hover:bg-white/10 focus:outline-none focus-visible:ring-2 focus-visible:ring-white md:hidden">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>

                <a routerLink="/eventos" class="inline-flex items-center rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-white">
                    <img
                        src="assets/logo/prefeitura/pmu-colorida-texto-branco-horizontal.png"
                        alt="Prefeitura de Uberaba"
                        class="h-9 w-auto object-contain sm:h-10">
                </a>
            </div>

            <div class="flex items-center gap-3">
                <span class="hidden text-sm text-white sm:inline">
                    Bem-vindo(a), <span class="font-medium">{{ primeiroNome }}</span>
                </span>
                <button
                    type="button"
                    (click)="logout()"
                    aria-label="Sair"
                    title="Sair"
                    class="inline-flex h-10 w-10 items-center justify-center rounded-lg text-white hover:bg-white/10 focus:outline-none focus-visible:ring-2 focus-visible:ring-white">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
                    </svg>
                </button>
            </div>
        </header>

        <div class="flex flex-1">
            <!-- Overlay do drawer no celular -->
            <div
                *ngIf="menuAberto"
                (click)="fecharMenu()"
                class="fixed inset-0 z-40 bg-black/50 md:hidden"
                aria-hidden="true">
            </div>

            <!-- Sidebar clara recolhível no desktop (sigla + ☰ no topo) e drawer no celular -->
            <nav
                id="menu-lateral"
                aria-label="Menu administrativo"
                class="fixed inset-y-0 left-0 z-50 w-[280px] bg-codiub-sidebar px-3.5 py-4 shadow-lg transition-all duration-200
                    md:static md:z-auto md:translate-x-0 md:border-r md:border-gray-200/80 md:py-4 md:shadow-none"
                [class.translate-x-0]="menuAberto"
                [class.-translate-x-full]="!menuAberto"
                [class.md:w-sidebar-open]="sidebarAberta"
                [class.md:w-sidebar]="!sidebarAberta">

                <!-- Cabeçalho do drawer no celular -->
                <div class="mb-4 flex items-center justify-between md:hidden">
                    <img
                        src="assets/logo/prefeitura/pmu-colorida-horizontal.png"
                        alt="Prefeitura de Uberaba"
                        class="h-8 w-auto object-contain">
                    <button type="button" (click)="fecharMenu()" aria-label="Fechar menu" class="btn-icon">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <!-- Topo da sidebar no desktop (sigla GE + botão ☰ igual ao Print 1) -->
                <div
                    class="mb-4 hidden h-10 items-center px-2 md:flex"
                    [ngClass]="sidebarAberta ? 'justify-between' : 'justify-center'">
                    <span *ngIf="sidebarAberta" class="text-lg font-semibold tracking-tight text-gray-900">GE</span>
                    <button
                        type="button"
                        (click)="alternarSidebar()"
                        [attr.aria-expanded]="sidebarAberta"
                        [attr.aria-label]="sidebarAberta ? 'Recolher menu lateral' : 'Expandir menu lateral'"
                        [title]="sidebarAberta ? 'Recolher menu' : 'Expandir menu'"
                        class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-gray-800 transition-colors hover:bg-navy-hover-tint focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>

                <!-- Grupo expansível: Cadastros -->
                <div class="mb-1.5">
                    <button
                        type="button"
                        (click)="alternarGrupoCadastros()"
                        [attr.aria-expanded]="cadastrosAberto"
                        title="Cadastros"
                        aria-label="Cadastros"
                        class="flex min-h-[44px] w-full items-center justify-between gap-3 rounded-lg px-3 text-sm text-gray-800 transition-colors hover:bg-navy-hover-tint focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600"
                        [class.md:justify-center]="!sidebarAberta">
                        <span class="flex items-center gap-3">
                            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M4 6h9M4 12h9M4 18h9M17 9v6M14 12h6" />
                            </svg>
                            <span [class.md:hidden]="!sidebarAberta">Cadastros</span>
                        </span>
                        <svg
                            class="h-4 w-4 shrink-0 text-gray-600 transition-transform duration-200"
                            [class.rotate-180]="cadastrosAberto"
                            [class.md:hidden]="!sidebarAberta"
                            fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M6 9l6 6 6-6" />
                        </svg>
                    </button>

                    <div *ngIf="cadastrosAberto" class="mt-1" [class.md:pl-6]="sidebarAberta">
                        <a
                            routerLink="/eventos"
                            routerLinkActive="bg-navy-tint font-bold text-codiub-brand shadow-[inset_3px_0_0_#002069]"
                            ariaCurrentWhenActive="page"
                            title="Eventos"
                            aria-label="Eventos"
                            class="mb-1 flex min-h-[42px] items-center gap-3 rounded-lg px-3 text-sm text-gray-800 transition-colors hover:bg-navy-hover-tint focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600"
                            [class.md:justify-center]="!sidebarAberta">
                            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="5" width="18" height="16" rx="2" />
                                <path d="M16 3v4M8 3v4M3 10h18" />
                            </svg>
                            <span [class.md:hidden]="!sidebarAberta">Eventos</span>
                        </a>
                    </div>
                </div>

                <!-- Link institucional -->
                <a
                    href="https://portal.uberaba.mg.gov.br/"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="Portal da Prefeitura"
                    aria-label="Portal da Prefeitura"
                    class="mb-1.5 flex min-h-[44px] items-center gap-3 rounded-lg px-3 text-sm text-gray-800 transition-colors hover:bg-navy-hover-tint focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600"
                    [class.md:justify-center]="!sidebarAberta">
                    <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z" />
                    </svg>
                    <span [class.md:hidden]="!sidebarAberta">Portal da Prefeitura</span>
                </a>
            </nav>

            <main id="conteudo" class="min-w-0 flex-1 p-5 sm:p-6">
                <router-outlet></router-outlet>
            </main>
        </div>
    </ng-container>

    <!-- ========================================================================= -->
    <!-- FACE 2: LAYOUT ÁREA PÚBLICA / CIDADÃO (Usuário comum, Login, Cadastro)     -->
    <!-- Barra branca com logo colorido + faixa navy com nome do sistema (Print 2)  -->
    <!-- ========================================================================= -->
    <ng-template #topoPublico>
        <header>
            <!-- Barra superior branca com logo colorido da Prefeitura -->
            <div class="flex items-center justify-between gap-4 bg-white px-4 py-3 sm:px-8">
                <a routerLink="/eventos" class="inline-flex items-center rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600">
                    <img
                        src="assets/logo/prefeitura/pmu-colorida-horizontal.png"
                        alt="Prefeitura de Uberaba"
                        class="h-10 w-auto object-contain sm:h-12">
                </a>

                <div *ngIf="areaEventos && authService.estaLogado()" class="flex items-center gap-3">
                    <span class="hidden text-sm text-gray-700 sm:inline">
                        Bem-vindo(a), <span class="font-semibold text-codiub-ink">{{ primeiroNome }}</span>
                    </span>
                    <button
                        type="button"
                        (click)="logout()"
                        aria-label="Sair"
                        title="Sair"
                        class="inline-flex h-10 w-10 items-center justify-center rounded-full text-codiub-navy transition-colors hover:bg-gray-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Faixa navy com o nome do produto -->
            <div class="bg-codiub-navy px-5 py-5 md:px-10 md:py-7">
                <p class="text-2xl font-bold text-white">Eventos</p>
            </div>
        </header>

        <main
            id="conteudo"
            [ngClass]="areaEventos ? 'mx-auto w-full max-w-6xl flex-1 px-4 py-6 sm:px-6' : 'flex flex-1 items-center justify-center p-4 sm:p-8'">
            <router-outlet></router-outlet>
        </main>
    </ng-template>

    <!-- Footer (assinatura CODIUB à esquerda, sistema ao centro, copyright em gray-300 à direita) -->
    <footer class="grid items-center gap-2 bg-codiub-navy px-4 py-3 text-center text-sm text-gray-300 md:grid-cols-3 md:text-left">
        <a href="https://codiub.com.br" target="_blank" rel="noopener noreferrer" class="justify-self-center rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-white md:justify-self-start">
            <img src="assets/logo/codiub-branca-horizontal.png" alt="Codiub" class="h-7 w-auto object-contain">
        </a>
        <p class="md:text-center">{{ modoCms ? 'Gerenciamento de Eventos' : 'Eventos' }}</p>
        <p class="md:text-right">© {{ ano }} Codiub - Todos os direitos reservados.</p>
    </footer>
</div>
