<div class="relative">
    <button
        type="button"
        (click)="alternarPainel()"
        [attr.aria-expanded]="aberto"
        aria-controls="painel-acessibilidade"
        aria-label="Opções de acessibilidade"
        title="Opções de acessibilidade"
        class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-white/25 bg-codiub-brand text-white transition-colors hover:bg-codiub-brand-hover focus:outline-none focus-visible:ring-2 focus-visible:ring-white">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="4.5" r="1.75" />
            <path d="M5 8.5h14M12 8.5v5.5m0 0l-3 6m3-6l3 6" />
        </svg>
    </button>

    <div
        *ngIf="aberto"
        id="painel-acessibilidade"
        role="region"
        aria-label="Ferramentas de acessibilidade"
        class="a11y-panel absolute right-0 top-full z-50 mt-2 w-72 rounded-lg border border-gray-200 bg-white p-3 text-gray-900 shadow-lg sm:w-80">
        <p class="mb-2.5 text-eyebrow uppercase text-gray-500">Acessibilidade</p>

        <div class="grid grid-cols-2 gap-2">
            <button
                type="button"
                (click)="aumentarFonte()"
                [disabled]="escalaFonte >= 125"
                class="rounded-lg bg-codiub-zebra px-3 py-2 text-sm font-semibold text-gray-900 transition-colors hover:bg-gray-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 disabled:cursor-not-allowed disabled:opacity-50">
                A+ Aumentar
            </button>

            <button
                type="button"
                (click)="diminuirFonte()"
                [disabled]="escalaFonte <= 87.5"
                class="rounded-lg bg-codiub-zebra px-3 py-2 text-sm font-semibold text-gray-900 transition-colors hover:bg-gray-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 disabled:cursor-not-allowed disabled:opacity-50">
                A- Diminuir
            </button>

            <button
                type="button"
                (click)="alternarContraste()"
                [attr.aria-pressed]="altoContraste"
                [ngClass]="altoContraste ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-codiub-zebra text-gray-900 hover:bg-gray-200'"
                class="col-span-2 rounded-lg px-3 py-2 text-sm font-semibold transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600">
                Contraste {{ altoContraste ? '(ativo)' : '' }}
            </button>

            <button
                type="button"
                (click)="alternarAnimacoes()"
                [attr.aria-pressed]="semAnimacao"
                [ngClass]="semAnimacao ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-codiub-zebra text-gray-900 hover:bg-gray-200'"
                class="col-span-2 rounded-lg px-3 py-2 text-sm font-semibold transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600">
                Desabilitar animações {{ semAnimacao ? '(ativo)' : '' }}
            </button>

            <button
                type="button"
                (click)="resetar()"
                class="col-span-2 rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-semibold text-gray-700 transition-colors hover:bg-gray-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600">
                Resetar
            </button>
        </div>
    </div>
</div>
