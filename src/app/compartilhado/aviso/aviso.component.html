<div
    [attr.role]="tipo === 'erro' ? 'alert' : 'status'"
    class="flex items-start gap-3 rounded-lg border px-4 py-3 text-sm font-medium leading-5"
    [ngClass]="classes">

    <span class="mt-px shrink-0" [ngClass]="classesIcone" aria-hidden="true">
        <svg *ngIf="tipo === 'sucesso'" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M8.5 12.5l2.5 2.5 4.5-5" />
        </svg>
        <svg *ngIf="tipo === 'erro'" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 8v4.5M12 16h.01" />
        </svg>
        <svg *ngIf="tipo === 'aviso'" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
            <path d="M12 9v4M12 17h.01" />
        </svg>
        <svg *ngIf="tipo === 'info'" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 11v5M12 8h.01" />
        </svg>
    </span>

    <span class="min-w-0 flex-1">{{ mensagem }}<ng-content></ng-content></span>
</div>
